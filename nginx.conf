# ──────────────────────────────────────────────────────────────
# nginx.conf — Admin Panel SPA (admin.nextkinlife.live)
# Serves the Vite-built static admin SPA with strict security headers.
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security Headers ─────────────────────────────────────

    # CSP for the admin panel — stricter than the public frontend.
    # connect-src allows ONLY api.nextkinlife.live (the single API origin).
    # 'unsafe-inline' for style-src only — Vite CSS injection; no script relaxation.
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self'; "
        "style-src 'self' 'unsafe-inline'; "
        "img-src 'self' data: blob: https://*.cloudfront.net https://*.s3.amazonaws.com; "
        "media-src 'self' https://*.cloudfront.net https://*.s3.amazonaws.com; "
        "connect-src 'self' https://api.nextkinlife.live wss://api.nextkinlife.live; "
        "font-src 'self'; "
        "frame-ancestors 'none'; "
        "object-src 'none'; "
        "base-uri 'self'; "
        "form-action 'self'; "
        "upgrade-insecure-requests"
        always;

    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — admin panel needs no device access
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Cache headers for static assets ──────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Re-apply security headers in location block
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}